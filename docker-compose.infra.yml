version: '3.8'

services:
  # Serviço 1: Banco Relacional (Para o Laravel)
  mysql: #nome do serviço
    image: mysql:8.0 # nome oficial registrado no Docker Hub 
    container_name: senai_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: senai_core_db
      MYSQL_USER: senai_user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - senai-net

  # Serviço 2: Banco NoSQL (Para o Python)
  mongo:
    image: mongo:6.0
    container_name: senai_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db
    networks:
      - senai-net

  # Serviço 3: Interface Web para o MongoDB (Opcional, ajuda visualizar)
  mongo-express:
    image: mongo-express
    container_name: senai_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
    depends_on:
      - mongo
    networks:
      - senai-net

  # Serviço 4: Redis (Opcional, mas bom ter para filas futuras)
  redis:
    image: redis:alpine
    container_name: senai_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - senai-net

volumes:
  mysql_data:
  mongo_data:

networks:
  senai-net:
    driver: bridge
    name: senai-net